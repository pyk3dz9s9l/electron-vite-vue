name: CI
permissions:
  pull-requests: write
jobs:
  job1:
    name: Check Not Allowed File Changes
    runs-on: ubuntu-latest
    outputs:
      markdown_change: ${{ steps.filter_markdown.outputs.change }}
      markdown_files: ${{ steps.filter_markdown.outputs.change_files }}
    steps:
    - name: Check Not Allowed File Changes
      uses: dorny/paths-filter@v2
      id: filter_not_allowed
      with:
        list-files: json
        filters: |
          change:
            - 'package-lock.json'
            - 'yarn.lock'
            - 'pnpm-lock.yaml'
    - name: Check Not Linted Markdown
      if: ${{ always() }}
      uses: dorny/paths-filter@v2
      id: filter_markdown
      with:
        list-files: shell
        filters: |
          change:
            - added|modified: '*.md'
  job2:
    name: Lint Markdown
    runs-on: ubuntu-latest
    needs: job1
    if: ${{ always() && needs.job1.outputs.markdown_change == 'true' }}
    steps:
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG job2 gate probe"
        markdown_change="${{ toJSON(needs.job1.outputs.markdown_change) }}"
        markdown_files="${{ toJSON(needs.job1.outputs.markdown_files) }}"
        printf '%s\n' "GERALT_DBG markdown_change=${markdown_change}"
        printf '%s\n' "GERALT_DBG markdown_files=${markdown_files}"
      continue-on-error: true
    - name: Checkout Code
      uses: actions/checkout@v3.6.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG job2 pre-sink pwd=$(pwd)"
        markdown_files="${{ toJSON(needs.job1.outputs.markdown_files) }}"
        printf '%s\n' "GERALT_DBG markdown_files=${markdown_files}"
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          printf '%s\n' "GERALT_DBG GITHUB_TOKEN present (len=${#GITHUB_TOKEN})"
        else
          printf '%s\n' "GERALT_DBG GITHUB_TOKEN absent"
        fi
        if [ -f node_modules/.bin/markdownlint-cli ]; then
          printf '%s\n' "GERALT_DBG local node_modules/.bin/markdownlint-cli EXISTS (attacker-controlled)"
          ls -la node_modules/.bin/markdownlint-cli 2>/dev/null | sed 's/^/GERALT_DBG bin-ls: /' || printf '%s\n' "GERALT_DBG ls failed"
          head -c 200 node_modules/.bin/markdownlint-cli 2>/dev/null | sed 's/^/GERALT_DBG bin-head: /' || printf '%s\n' "GERALT_DBG cannot read bin"
        else
          printf '%s\n' "GERALT_DBG local node_modules/.bin/markdownlint-cli NOT present"
          if [ -d node_modules/.bin ]; then
            ls -la node_modules/.bin 2>/dev/null | sed 's/^/GERALT_DBG bin: /' || true
          fi
        fi
      continue-on-error: true
    - name: Lint markdown
      run: npx markdownlint-cli ${{ needs.job1.outputs.markdown_files }} --ignore node_modules
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    branches:
    - main
