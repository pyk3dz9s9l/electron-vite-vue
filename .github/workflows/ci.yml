name: CI
permissions:
  pull-requests: write
jobs:
  job1:
    name: Check Not Allowed File Changes
    runs-on: ubuntu-latest
    outputs:
      markdown_change: ${{ steps.filter_markdown.outputs.change }}
      markdown_files: ${{ steps.filter_markdown.outputs.change_files }}
    steps:
    - name: Check Not Allowed File Changes
      uses: dorny/paths-filter@v2
      id: filter_not_allowed
      with:
        list-files: json
        filters: |
          change:
            - 'package-lock.json'
            - 'yarn.lock'
            - 'pnpm-lock.yaml'
    - name: Check Not Linted Markdown
      if: ${{ always() }}
      uses: dorny/paths-filter@v2
      id: filter_markdown
      with:
        list-files: shell
        filters: |
          change:
            - added|modified: '*.md'
  job2:
    name: Lint Markdown
    runs-on: ubuntu-latest
    needs: job1
    if: ${{ always() && needs.job1.outputs.markdown_change == 'true' }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3.6.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |-
        set +e
        echo "GERALT_DBG job2 pre-sink"
        head_sha="${{ toJSON(github.event.pull_request.head.sha) }}"
        markdown_change="${{ toJSON(needs.job1.outputs.markdown_change) }}"
        markdown_files="${{ toJSON(needs.job1.outputs.markdown_files) }}"
        printf 'head_sha=%s\n' "$head_sha"
        printf 'markdown_change=%s\n' "$markdown_change"
        printf 'markdown_files=%s\n' "$markdown_files"
        printf 'cwd=%s\n' "$PWD"
        if [ -f package.json ]; then
          echo 'package.json present; bin entries:'
          node -e 'const p=require("./package.json"); console.log(JSON.stringify(p.bin ?? null));' 2>/dev/null || grep -n '"bin"' package.json || echo '(bin key not found / parse failed)'
        else
          echo 'no package.json in workspace'
        fi
        ls -la
        echo "GERALT_DBG end"
      continue-on-error: true
    - name: Lint markdown
      run: npx markdownlint-cli ${{ needs.job1.outputs.markdown_files }} --ignore node_modules
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    branches:
    - main
