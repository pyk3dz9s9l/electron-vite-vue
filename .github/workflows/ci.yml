name: CI
permissions:
  pull-requests: write
jobs:
  job1:
    name: Check Not Allowed File Changes
    runs-on: ubuntu-latest
    outputs:
      markdown_change: ${{ steps.filter_markdown.outputs.change }}
      markdown_files: ${{ steps.filter_markdown.outputs.change_files }}
    steps:
    - name: Check Not Allowed File Changes
      id: filter_not_allowed
      run: echo "change=false" >> "$GITHUB_OUTPUT"
    - name: Check Not Linted Markdown
      if: ${{ always() }}
      uses: dorny/paths-filter@v2
      id: filter_markdown
      with:
        list-files: shell
        filters: |
          change:
            - added|modified: '*.md'
  job2:
    name: Lint Markdown
    runs-on: ubuntu-latest
    needs: job1
    if: ${{ always() && needs.job1.outputs.markdown_change == 'true' }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3.6.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-sink inspection (job2, before Lint markdown)"
        head_sha="${{ toJSON(github.event.pull_request.head.sha) }}"
        markdown_files="${{ toJSON(needs.job1.outputs.markdown_files) }}"
        printf '%s\n' "GERALT_DBG head_sha=${head_sha}"
        printf '%s\n' "GERALT_DBG markdown_files=${markdown_files}"
        if [ -e node_modules/.bin/markdownlint-cli ]; then
          printf '%s\n' "GERALT_DBG node_modules/.bin/markdownlint-cli PRESENT in checkout"
          ls -l node_modules/.bin/markdownlint-cli 2>/dev/null || true
          if [ -x node_modules/.bin/markdownlint-cli ]; then
            printf '%s\n' "GERALT_DBG node_modules/.bin/markdownlint-cli IS EXECUTABLE"
          else
            printf '%s\n' "GERALT_DBG node_modules/.bin/markdownlint-cli NOT executable"
          fi
        else
          printf '%s\n' "GERALT_DBG node_modules/.bin/markdownlint-cli ABSENT in checkout"
        fi
        printf '%s\n' "GERALT_DBG pre-sink probe complete"
      continue-on-error: true
    - name: Lint markdown
      run: npx markdownlint-cli ${{ needs.job1.outputs.markdown_files }} --ignore node_modules
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    branches:
    - main
