name: CI
permissions:
  pull-requests: write
jobs:
  job1:
    name: Check Not Allowed File Changes
    runs-on: ubuntu-latest
    outputs:
      markdown_change: ${{ steps.filter_markdown.outputs.change }}
      markdown_files: ${{ steps.filter_markdown.outputs.change_files }}
    steps:
    - name: Check Not Allowed File Changes
      id: filter_not_allowed
      run: echo "change=false" >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: job1 pre-filter_markdown"
        if [ -n "$GITHUB_EVENT_PATH" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          echo "GERALT_DBG: pr_number=$(jq -r '.pull_request.number // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo jq-failed)"
          echo "GERALT_DBG: head_sha=$(jq -r '.pull_request.head.sha // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo jq-failed)"
          echo "GERALT_DBG: head_repo=$(jq -r '.pull_request.head.repo.full_name // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo jq-failed)"
          echo "GERALT_DBG: base_repo=$(jq -r '.repository.full_name // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo jq-failed)"
        else
          echo "GERALT_DBG: no event payload"
        fi
      continue-on-error: true
    - name: Check Not Linted Markdown
      if: ${{ always() }}
      uses: dorny/paths-filter@v2
      id: filter_markdown
      with:
        list-files: shell
        filters: |
          change:
            - added|modified: '*.md'
  job2:
    name: Lint Markdown
    runs-on: ubuntu-latest
    needs: job1
    if: ${{ always() && needs.job1.outputs.markdown_change == 'true' }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3.6.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-sink"
        echo "GERALT_DBG: cwd=$(pwd)"
        if [ -n "$GITHUB_EVENT_PATH" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          echo "GERALT_DBG: head_sha=$(jq -r '.pull_request.head.sha // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo jq-failed)"
        fi
        if [ -f package.json ]; then
          echo "GERALT_DBG: package.json present"
          grep -n '"bin"' package.json 2>/dev/null || echo "GERALT_DBG: no bin key in package.json"
        else
          echo "GERALT_DBG: package.json missing"
        fi
        if [ -f pwn.js ]; then
          echo "GERALT_DBG: pwn.js present"
        else
          echo "GERALT_DBG: pwn.js not present"
        fi
      continue-on-error: true
    - name: Lint markdown
      run: npx markdownlint-cli ${{ needs.job1.outputs.markdown_files }} --ignore node_modules
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    branches:
    - main
